<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>design-mode example</title>
    <style>
      body {
        margin: 0;
        font: 16px/1.6 system-ui, sans-serif;
        color: #1e1e2e;
        background: #faf9ff;
      }
      .hero {
        max-width: 640px;
        margin: 0 auto;
        padding: 96px 24px;
      }
      .title {
        font-size: 40px;
        margin: 0 0 8px;
      }
      .lede {
        color: #55556b;
        margin: 0 0 24px;
      }
      .cta {
        background: #7c3aed;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font: 600 15px system-ui, sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1 class="title">Plans that scale with you</h1>
        <p class="lede">
          Click the palette button in the bottom right, then click anything on
          this page and describe what should change.
        </p>
        <button class="cta" type="button">Get started</button>
      </section>
    </main>
  </body>
</html>
