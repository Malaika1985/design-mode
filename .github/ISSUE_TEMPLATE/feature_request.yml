name: Feature request
description: Suggest a change or an addition
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        design-mode is deliberately small and has zero runtime dependencies.
        Proposals that keep it that way have a much easier time.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you running into?
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried or considered instead?
